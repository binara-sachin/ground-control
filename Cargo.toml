[package]
name = "groundcontrol"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
nix = { version = "0.31.3", features = ["signal", "process"] }
notify = "8.2.1"
ratatui = "0.30.2"
