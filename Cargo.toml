[package]
name = "groundcontrol"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
nix = { version = "0.31.3", features = ["fs", "signal", "process", "user"] }
notify = "8.2.1"
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
unicode-width = "0.2.3"
vt100 = "0.18.1"
yaml-rust2 = "0.13.0"

[dev-dependencies]
tempfile = "3.27.0"
