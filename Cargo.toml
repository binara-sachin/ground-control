serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
unicode-width = "0.2.3"
vt100 = "0.18.1"
yaml-rust2 = "0.13.0"

[dev-dependencies]
tempfile = "3.27.0"
