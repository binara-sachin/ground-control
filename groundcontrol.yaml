# GroundControl configuration (spec §7). Edited by hand only. An open TUI
# reloads it on save and keeps the previous good config if this one is invalid;
# each run or service window uses the config as it was when it started.

env: {}

# The folder the Projects screen scans for git repositories (default ~/dev).
dev_dir: ~/dev

projects:
  tmux-ui-manager:
    path: ~/dev/tmux-ui-manager
    remote: github.com/binara-sachin/tmux-ui-manager
    # tmux loads the plugin from ~/.config/tmux/plugins/tmux-ui-manager (a TPM
    # clone). `link-dev` replaces that clone with a link to this checkout once;
    # after that `deploy` is build + rebind. launch.sh runs the binary on every
    # popup open, so a new build is live the next time the popup opens.
    pipelines:
      status:
        description: "Shows how the tmux plugin is installed, which checkout and commit it points at, whether the binary is built, and whether the key binding is loaded."
        steps:
          - name: Plugin state
            run: |
              P="$HOME/.config/tmux/plugins/tmux-ui-manager"
              if [ -L "$P" ]; then echo "plugin dir: link -> $(readlink "$P")"
              elif [ -d "$P" ]; then echo "plugin dir: TPM clone (run link-dev to use this checkout)"
              else echo "plugin dir: missing"; fi
              echo "checkout:   $(pwd -P) @ $(git rev-parse --short HEAD)"
              ls -l target/release/tmux-ui-manager 2>/dev/null || echo "binary:     not built"
              tmux list-keys 2>/dev/null | grep -F "tmux-ui-manager" || echo "key binding: not found (no tmux server, or not loaded)"

      link-dev:
        description: "Replaces the TPM clone of the plugin with a link to this dev checkout, keeping the clone as a backup. Asks for approval first."
        protected: true
        steps:
          - name: Check plugin dir
            run: |
              P="$HOME/.config/tmux/plugins/tmux-ui-manager"
              if [ -L "$P" ]; then echo "already a link -> $(readlink "$P")"; exit 0; fi
              test -d "$P/.git" || { echo "$P is not a TPM git clone; refusing to touch it" >&2; exit 1; }
              test -z "$(git -C "$P" status --porcelain)" || { echo "$P has uncommitted changes; refusing" >&2; exit 1; }
              test ! -e "$P.tpm-backup" || { echo "$P.tpm-backup already exists; refusing" >&2; exit 1; }
              echo "will move $P to $P.tpm-backup and link it to $(pwd -P)"
          - approve: "Replace the TPM clone of tmux-ui-manager with a link to this dev checkout? (The clone is kept as .tpm-backup.)"
          - name: Link
            run: |
              P="$HOME/.config/tmux/plugins/tmux-ui-manager"
              [ -L "$P" ] && { echo "already linked"; exit 0; }
              mv "$P" "$P.tpm-backup" && ln -s "$(pwd -P)" "$P"
              echo "linked $P -> $(pwd -P)"
      unlink-dev:
        description: "Removes the dev link and restores the original TPM clone from its backup. Asks for approval first."
        protected: true
        steps:
          - name: Check link
            run: |
              P="$HOME/.config/tmux/plugins/tmux-ui-manager"
              test -L "$P" || { echo "$P is not a link; nothing to undo" >&2; exit 1; }
              test -d "$P.tpm-backup" || { echo "$P.tpm-backup is missing; cannot restore the clone" >&2; exit 1; }
              echo "will remove the link and restore $P.tpm-backup"
          - approve: "Remove the dev link and restore the TPM clone of tmux-ui-manager?"
          - name: Restore
            run: |
              P="$HOME/.config/tmux/plugins/tmux-ui-manager"
              rm "$P" && mv "$P.tpm-backup" "$P"
              tmux run-shell "$P/manager.tmux"

      deploy:
        description: "Builds a release binary and rebinds the tmux key so the new build is live the next time the popup opens."
        steps:
          - name: Build
            run: cargo build --release
          - name: Check plugin link
            run: |
              P="$HOME/.config/tmux/plugins/tmux-ui-manager"
              test -L "$P" && [ "$(cd "$P" && pwd -P)" = "$(pwd -P)" ] \
                || { echo "tmux does not load this checkout; run link-dev first" >&2; exit 1; }
          - name: Rebind in tmux
            run: tmux run-shell "$HOME/.config/tmux/plugins/tmux-ui-manager/manager.tmux"   # fails clearly if no tmux server is running

  # These pipelines replace the novels repo's retired GitHub Actions workflows.
  # The daily scheduled sync is now run by hand (ground-control has no
  # schedules). Each pipeline commits and pushes from the real checkout using
  # your own git/gh login.
  novels:
    path: ~/dev/novels
    remote: github.com/binara-sachin/novels
    pipelines:
      sync:
        description: "Fetches new chapters for one novel or all of them, regenerates the README, and commits and pushes the archive."
        inputs:
          novel:
            type: string
            pattern: "^(all|[a-z0-9-]+)$"
            default: all
          limit:
            type: string
            pattern: "^[0-9]+$"
            default: "0"
        steps:
          - name: Set up Python
            run: scripts/bootstrap.sh
          - name: Sync
            timeout: 90m
            run: |
              set -e
              args=()
              [ "$INPUT_NOVEL" != "all" ] && args+=(--novel "$INPUT_NOVEL")
              [ "$INPUT_LIMIT" != "0" ] && args+=(--limit "$INPUT_LIMIT")
              .venv/bin/python -m novels.cli sync "${args[@]}"
          - name: Regenerate README
            run: .venv/bin/python -m novels.cli readme
          - name: Commit and push
            run: |
              scripts/commit-archive.sh "sync: {n} new chapter file(s)" archive README.md

      add-novel:
        description: "Adds a novel by its Royal Road fiction id, then commits and pushes the updated novels list and README."
        inputs:
          fiction_id:
            type: string
            pattern: "^[0-9]+$"
          slug:
            type: string
            pattern: "^(auto|[a-z0-9-]+)$"
            default: auto
          complete:
            type: bool
            default: "false"
        steps:
          - name: Set up Python
            run: scripts/bootstrap.sh
          - name: Add novel
            run: |
              set -e
              args=()
              [ "$INPUT_COMPLETE" = "true" ] && args+=(--complete)
              .venv/bin/python -m novels.cli add-novel --fiction-id "$INPUT_FICTION_ID" --slug "$INPUT_SLUG" "${args[@]}"
          - name: Commit and push
            run: |
              scripts/commit-archive.sh "add novel: fiction_id $INPUT_FICTION_ID" novels.yaml README.md

      build:
        description: "Optionally syncs a novel first, then builds its EPUB and uploads it to the rolling GitHub release."
        inputs:
          novel:
            type: string
            pattern: "^[a-z0-9-]+$"
          sync_first:
            type: bool
            default: "true"
        steps:
          - name: Set up Python
            run: scripts/bootstrap.sh
          - name: Sync first
            timeout: 60m
            run: |
              set -e
              if [ "$INPUT_SYNC_FIRST" = "false" ]; then echo "skipped"; exit 0; fi
              .venv/bin/python -m novels.cli sync --novel "$INPUT_NOVEL"
              .venv/bin/python -m novels.cli readme
              scripts/commit-archive.sh "sync before build" archive README.md
          - name: Build
            timeout: 30m
            run: scripts/build.sh "$INPUT_NOVEL"
          - name: Publish release
            run: scripts/publish-release.sh "$INPUT_NOVEL"
